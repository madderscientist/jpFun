name: Publish @jpfun/editor-tools

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - run: pnpm install --frozen-lockfile

      - run: pnpm --filter @jpfun/editor-tools... build

      - run: pnpm --filter @jpfun/editor-tools typecheck

      - run: pnpm --filter @jpfun/editor-tools test

      - run: pnpm --filter @jpfun/editor-tools -r publish --access public --provenance