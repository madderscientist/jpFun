<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>jpFun</title>
    <link rel="stylesheet" href="/styles.css" />
</head>
<body>
    <div class="app-shell">
        <main class="workspace" id="workspace" data-view="split">
            <section class="editor-panel" aria-label="源码编辑器">
                <div class="pane-toolbar">
                    <div class="pane-tabs" role="tablist" aria-label="编辑工作区">
                        <button class="pane-tab" id="sourceTab" type="button" role="tab" data-left-tab="source" aria-selected="true" aria-controls="sourcePane" title="再次点击以打开或导入本地曲谱">
                            <span class="file-dot" id="fileDirty" aria-hidden="true"></span>
                            <span class="source-name" id="sourceName">score.jpfun</span>
                        </button>
                        <button class="pane-tab" id="playbackTab" type="button" role="tab" data-left-tab="playback" aria-selected="false" aria-controls="playbackPane">
                            <span class="tab-icon" aria-hidden="true">▶</span>
                            播放
                        </button>
                    </div>
                    <span class="source-size" id="sourceSize">0 字符</span>
                </div>

                <div class="pane-stack">
                    <div class="source-pane" id="sourcePane" role="tabpanel" aria-labelledby="sourceTab">
                        <div class="editor-host" id="sourceEditor" aria-label="jpFun 源码"></div>
                    </div>

                    <section class="playback-pane" id="playbackPane" role="tabpanel" aria-labelledby="playbackTab" hidden>
                        <div class="playback-scroll">
                            <button class="playback-status" id="playbackStatus" type="button" data-state="idle" disabled>打开播放页以生成演奏计划</button>

                            <section class="control-section" aria-labelledby="transportTitle">
                                <div class="section-heading">
                                    <h3 id="transportTitle">走带</h3>
                                    <span><span id="playbackCurrentTime">00:00</span> / <span id="playbackTotalTime">00:00</span></span>
                                </div>
                                <div class="transport-controls">
                                    <button class="transport-button" id="playbackRestart" type="button" title="回到开头" disabled aria-label="回到开头">◀</button>
                                    <button class="transport-button primary" id="playbackToggle" type="button" title="播放" disabled aria-label="播放">▶</button>
                                    <button class="transport-button" id="playbackStop" type="button" title="停止" disabled aria-label="停止">■</button>
                                </div>
                                <input class="playback-progress" id="playbackProgress" type="range" min="0" max="0" value="0" step="0.001" disabled aria-label="播放进度" />
                                <div class="parameter-grid">
                                    <label class="range-label full">速度倍率<input id="playbackRate" type="range" value="1" step="0.05" min="0.25" max="4" disabled /><output id="playbackRateValue">1.00×</output></label>
                                    <label>移调（半音）<input id="playbackTranspose" type="number" value="0" step="1" min="-24" max="24" disabled /></label>
                                </div>
                            </section>

                            <section class="control-section" id="mixerSection" aria-labelledby="mixerTitle" hidden>
                                <div class="section-heading"><h3 id="mixerTitle">声部混音</h3><span id="mixerSummary">0 声部</span></div>
                                <div class="mixer-tracks" id="mixerTracks"></div>
                            </section>
                        </div>
                    </section>
                </div>
            </section>

            <div
                class="workspace-divider"
                id="workspaceDivider"
                role="separator"
                aria-label="调整编辑器和预览宽度"
                aria-orientation="vertical"
                aria-valuemin="25"
                aria-valuemax="75"
                aria-valuenow="40"
                tabindex="0"
            ></div>

            <section class="preview-panel" aria-label="谱面预览">
                <div class="pane-toolbar result-toolbar">
                    <div class="pane-tabs" role="tablist" aria-label="结果工作区">
                        <button class="pane-tab" id="previewTab" type="button" role="tab" data-right-tab="preview" aria-selected="true" aria-controls="previewPane">谱面</button>
                        <button class="pane-tab" id="problemsTab" type="button" role="tab" data-right-tab="problems" aria-selected="false" aria-controls="problemsPane">
                            诊断
                            <span class="tab-badge" id="diagnosticCount">0</span>
                        </button>
                    </div>
                    <div class="preview-tools" id="previewTools">
                        <button class="compile-button" id="runLayout" type="button">
                            <span aria-hidden="true">▶</span>
                            排版
                        </button>
                        <div class="zoom-control">
                            <button
                                class="tool-button zoom-button"
                                id="zoomButton"
                                type="button"
                                aria-haspopup="true"
                                aria-expanded="false"
                                title="设置预览缩放"
                            >100%</button>
                            <div class="zoom-menu" id="zoomMenu" role="menu" hidden>
                                <button id="fitWidth" type="button" role="menuitem">适合宽度</button>
                                <div class="zoom-menu-separator" role="separator"></div>
                                <button type="button" role="menuitem" data-zoom="50">50%</button>
                                <button type="button" role="menuitem" data-zoom="75">75%</button>
                                <button type="button" role="menuitem" data-zoom="100">100%</button>
                                <button type="button" role="menuitem" data-zoom="125">125%</button>
                                <button type="button" role="menuitem" data-zoom="150">150%</button>
                                <button type="button" role="menuitem" data-zoom="200">200%</button>
                            </div>
                        </div>
                        <div class="backend-tabs" role="tablist" aria-label="渲染后端">
                            <button class="backend-tab" role="tab" data-backend="svg" aria-selected="true">SVG</button>
                            <button class="backend-tab" role="tab" data-backend="canvas" aria-selected="false">Canvas</button>
                        </div>
                        <div class="export-control">
                            <button
                                class="tool-button export-button"
                                id="exportButton"
                                type="button"
                                aria-haspopup="dialog"
                                aria-expanded="false"
                                aria-label="导出"
                                title="导出"
                            >
                                <svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true">
                                    <path d="M11 7L8 10M8 10L5 7M8 10L8 3" stroke="currentColor" stroke-width="1.25" stroke-miterlimit="10" stroke-linecap="square"></path>
                                    <path d="M3 13H13" stroke="currentColor" stroke-width="1.25"></path>
                                </svg>
                            </button>
                            <div class="export-menu" id="exportMenu" role="dialog" aria-label="导出" hidden>
                                <div class="export-menu-header">
                                    <strong>导出</strong>
                                    <span>谱面与演奏</span>
                                </div>
                                <div class="export-formats">
                                    <button type="button" data-export-format="midi">
                                        <strong>MIDI</strong><span>演奏</span>
                                    </button>
                                    <button type="button" data-export-format="pdf">
                                        <strong>PDF</strong><span>打印</span>
                                    </button>
                                    <button type="button" data-export-format="svg">
                                        <strong>SVG</strong><span>矢量</span>
                                    </button>
                                    <label class="export-ppi">
                                        <span>PNG / JPEG</span>
                                        <span class="export-ppi-input">
                                            <input id="exportPpi" type="number" min="72" max="600" step="1" value="144" inputmode="numeric" aria-label="位图精度" />
                                            <span>PPI</span>
                                        </span>
                                    </label>
                                    <button type="button" data-export-format="png">
                                        <strong>PNG</strong><span>透明</span>
                                    </button>
                                    <button type="button" data-export-format="jpeg">
                                        <strong>JPEG</strong><span>白底</span>
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="pane-stack">
                    <section class="preview-pane" id="previewPane" role="tabpanel" aria-labelledby="previewTab">
                        <div class="preview-scroll" id="previewScroll">
                            <div class="preview-host" id="previewHost"></div>
                        </div>
                    </section>

                    <section class="problems-pane" id="problemsPane" role="tabpanel" aria-labelledby="problemsTab" hidden>
                        <div class="problems-summary">
                            <div>
                                <span class="section-kicker">DIAGNOSTICS</span>
                                <h2>诊断</h2>
                            </div>
                            <span id="diagnosticSummary">未发现诊断</span>
                        </div>
                        <div class="diagnostics-panel" id="diagnosticsPanel" data-empty="true" aria-label="诊断">
                            <div class="diagnostics-empty">
                                <strong>没有诊断</strong>
                                <span>当前曲谱可以正常排版。</span>
                            </div>
                            <div class="diagnostics" id="diagnostics" aria-live="polite"></div>
                        </div>
                    </section>
                </div>

            </section>
        </main>

        <footer class="statusbar" aria-label="工作区状态">
            <div class="view-switch" role="group" aria-label="工作区布局">
                <button type="button" data-view="editor">编辑</button>
                <button type="button" data-view="split" aria-pressed="true">拆分</button>
                <button type="button" data-view="preview">预览</button>
            </div>
            <div class="theme-control">
                <button class="theme-button" id="themeButton" type="button" aria-haspopup="true" aria-expanded="false" title="切换界面主题">2026 Light</button>
                <div class="theme-menu" id="themeMenu" role="menu" hidden>
                    <button type="button" role="menuitemradio" data-theme-value="2026-light" aria-checked="true">2026 Light</button>
                    <button type="button" role="menuitemradio" data-theme-value="quiet-light" aria-checked="false">Quiet Light</button>
                </div>
            </div>
            <div class="status-results">
                <button class="status-message" id="statusMessage" type="button" data-state="ok">就绪</button>
                <span class="status-item" id="layoutStats">布局 0 个对象</span>
                <span class="status-item" id="layoutTime">用时 --</span>
            </div>
        </footer>
    </div>

    <div class="print-host" id="printHost" aria-hidden="true"></div>

    <script type="module" src="/main.ts"></script>
</body>
</html>
